plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'dark-enchanting-umbra'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Dev-only game tests (src/gametest). Loaded as part of the mod only by the gameTestServer run; never in the jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Production mods ship Mixin refmaps in SRG names; remap them for the dev (official) mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        // Runs every dark_enchanting game test (including the compatibility tests in src/gametest), then exits.
        // Uses its own directory so the throwaway test world never mixes with run/ (shared by all branches).
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.gametest
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    // Mods used only for compatibility testing in dev runs. Not bundled and not on the compile classpath.
    devMods {
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // A popular mod that adds new enchantments: Majrusz's Enchantments 1.10.7-backport.1 (Forge 1.19.2)
    // and its required Majrusz Library 7.0.5-backport.1 (Modrinth version ids in gradle.properties).
    devMods fg.deobf("maven.modrinth:majruszs-enchantments:${majruszs_enchantments_version}")
    devMods fg.deobf("maven.modrinth:majrusz-library:${majrusz_library_version}")
}

// Majrusz Library discovers its classes by scanning jars in the game's ./mods folder, so it fails when loaded from
// the Gradle classpath. Sync the remapped (official-name) jars into <run dir>/mods before each dev run instead.
// They get a "devmod-" prefix: stale devmod jars (e.g. from another branch's Minecraft version) are removed,
// anything else in mods/ is left alone.
def devModsTask = { String name, String runDir ->
    tasks.register(name, Sync) {
        from configurations.devMods
        into file("${runDir}/mods")
        rename { "devmod-${it}" }
        preserve {
            include '**/*'
            exclude 'devmod-*'
        }
    }
}
def copyDevMods = devModsTask('copyDevMods', 'run')
def copyGameTestDevMods = devModsTask('copyGameTestDevMods', 'run-gametest')

// The game test world is throwaway; recreate it on every run.
def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete file('run-gametest/world')
}

tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    if (it.name.startsWith('prepareRunGameTestServer')) {
        dependsOn copyGameTestDevMods, cleanGameTestWorld
    } else {
        dependsOn copyDevMods
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // LGPL-3.0 (LICENSE) is a set of additional permissions on top of GPL-3.0 (COPYING); ship both.
    from(['LICENSE', 'COPYING']) {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
